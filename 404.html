<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>문제풀이 앱 - 페이지를 찾을 수 없습니다</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F8F9FC; color: #1D2433; font-family: Arial, sans-serif; }
    main { width: min(420px, calc(100% - 48px)); padding: 32px 24px; text-align: center; background: white; border: 1px solid #E5E8F0; border-radius: 20px; box-sizing: border-box; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: #697386; line-height: 1.6; }
    a { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 12px; background: #3653E8; color: white; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 변경되었거나 존재하지 않는 페이지입니다.</p>
    <a id="home" href="./">홈으로 이동</a>
  </main>
  <script>
    const parts = location.pathname.split('/').filter(Boolean);
    const known = ['exam', 'manage', 'progress', 'result', 'review'];
    const base = parts.length && !known.includes(parts[0]) ? '/' + parts[0] + '/' : '/';
    document.getElementById('home').href = base;
  </script>
</body>
</html>
